# Configuration de l'analyse SonarQube du backend.
# Le scanner est lancé depuis le dossier backend/ (voir integration-continue/Jenkinsfile) :
# tous les chemins ci-dessous sont relatifs à backend/.

sonar.projectKey=souverainrecrut-backend
sonar.projectName=SouverainRecrut Backend
sonar.sourceEncoding=UTF-8

# Code applicatif et tests
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

# Fichiers ignorés par l'analyse
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Couverture : rapport lcov produit par Jest (npm run test:coverage).
# src/server.ts (démarrage du serveur) est exclu, comme dans jest.config.js.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/server.ts

# Quality Gate : le scanner attend le verdict de SonarQube et échoue si le gate
# est rouge, ce qui bloque la pipeline (aucun webhook nécessaire).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
